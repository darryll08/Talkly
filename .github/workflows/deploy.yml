# Deploy produksi untuk setiap push ke main oleh siapa pun (K6).
# Vercel Hobby tidak men-deploy commit kolaborator, jadi deploy dijalankan dengan token pemilik proyek (Darryl).
# Bila `npm run periksa` merah, deploy dibatalkan dan status merah tampil di commit penulisnya.
name: Periksa dan deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  periksa:
    runs-on: ubuntu-latest
    env:
      SESI_RAHASIA: rahasia-hanya-untuk-ci-bukan-produksi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run periksa

  deploy:
    needs: periksa
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cek secret Vercel
        id: cek
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Secret VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID belum diisi; deploy dilewati." >> "$GITHUB_STEP_SUMMARY"
            echo "ada=0" >> "$GITHUB_OUTPUT"
          else
            echo "ada=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cek.outputs.ada == '1'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.cek.outputs.ada == '1'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - if: steps.cek.outputs.ada == '1'
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deploy: $url (oleh ${{ github.actor }}, commit ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
